<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 虛擬試衣互動投影系統</title>
  
  <!-- 引入官方 MediaPipe Pose 與 Camera 工具 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121216;
      color: #edf2f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* 主視訊舞台 */
    #stage-container {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1); /* 水平鏡像翻轉，如同照鏡子 */
    }
    #webcam {
      display: none;
    }

    /* 載入中遮罩 */
    #loading-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-size: 1.2rem;
      gap: 15px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #3a86ff;
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 右側操作面板 */
    #sidebar {
      width: 300px;
      height: 100%;
      background-color: #1e2029;
      border-left: 1px solid #2d303e;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .panel-hidden {
      display: none !important;
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #f8f9fa;
      font-weight: 600;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }
    .btn-group::-webkit-scrollbar {
      width: 6px;
    }
    .btn-group::-webkit-scrollbar-thumb {
      background: #3b4252;
      border-radius: 3px;
    }

    .cloth-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .cloth-btn {
      flex: 1;
      background-color: #2e3440;
      color: #e5e9f0;
      border: 1px solid #434c5e;
      padding: 12px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .cloth-btn:hover {
      background-color: #3b4252;
    }
    .cloth-btn.active {
      background-color: #ef233c;
      border-color: #ff758f;
      color: #fff;
      font-weight: bold;
    }
    .delete-btn {
      background-color: #4c566a;
      border: none;
      color: #d8dee9;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .delete-btn:hover {
      background-color: #bf616a;
      color: #fff;
    }

    /* 調整工具區塊 */
    .adjust-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2d303e;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .adjust-label {
      font-size: 0.85rem;
      color: #d8dee9;
      display: flex;
      justify-content: space-between;
    }
    input[type=range] {
      width: 100%;
      accent-color: #3a86ff;
      cursor: pointer;
    }

    .upload-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2d303e;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .upload-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #4361ee;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .upload-btn:hover {
      background-color: #3a56d4;
    }

    .footer-tools {
      margin-top: auto;
      padding-top: 12px;
    }
    .fullscreen-btn {
      width: 100%;
      background-color: #3a86ff;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .fullscreen-btn:hover {
      background-color: #2563eb;
    }
    .tip-text {
      font-size: 0.8rem;
      color: #8d99ae;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 左側投影主舞台 -->
  <div id="stage-container">
    <div id="loading-mask">
      <div class="spinner"></div>
      <div>正在載入 AI 骨架偵測模型...</div>
    </div>
    <video id="webcam" playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <!-- 右側操作面板 -->
  <div id="sidebar">
    <h2>👗 服裝圖庫清單</h2>
    <div class="btn-group" id="btn-group"></div>

    <!-- 高度即時微調拉桿 -->
    <div class="adjust-box">
      <div class="adjust-label">
        <span>衣服高低微調</span>
        <span id="offset-val">3%</span>
      </div>
      <input type="range" id="offset-slider" min="-15" max="20" value="3" step="1">
    </div>

    <!-- 上傳按鈕 -->
    <div class="upload-box">
      <label class="upload-btn">
        ➕ 上傳去背 PNG 衣服
        <input type="file" id="cloth-uploader" accept="image/png" multiple style="display: none;">
      </label>
    </div>

    <div class="footer-tools">
      <button class="fullscreen-btn" id="fs-btn">🖥️ 全螢幕投影 (F11)</button>
      <div class="tip-text">
        • <b>F11</b>：切換純淨全螢幕投影<br>
        • <b>方向鍵 ← / →</b>：切換衣服<br>
        • <b>數字鍵 1~9</b>：快速選擇衣服
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const btnGroup = document.getElementById('btn-group');
    const sidebar = document.getElementById('sidebar');
    const loadingMask = document.getElementById('loading-mask');
    const offsetSlider = document.getElementById('offset-slider');
    const offsetVal = document.getElementById('offset-val');

    let currentOutfitIdx = 0;
    let outfits = [];
    // 預設將領口偏移由 15% 調降至 3%，精準貼合肩膀鎖骨
    let collarOffsetPercent = 0.03;

    // 滑桿即時調整
    offsetSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      collarOffsetPercent = val / 100;
      offsetVal.innerText = `${val}%`;
    });

    // ==========================================
    // 1. 本地示範服裝生成器 (備用)
    // ==========================================
    function createDemoClothing(type) {
      const cvs = document.createElement('canvas');
      cvs.width = 600;
      cvs.height = 700;
      const ctx = cvs.getContext('2d');

      if (type === 'jacket') {
        ctx.fillStyle = "#1e3d59";
        ctx.beginPath();
        ctx.moveTo(150, 60); ctx.lineTo(450, 60);
        ctx.lineTo(580, 280); ctx.lineTo(480, 320);
        ctx.lineTo(450, 680); ctx.lineTo(150, 680);
        ctx.lineTo(120, 320); ctx.lineTo(20, 280);
        ctx.closePath();
        ctx.fill();
        ctx.clearRect(240, 60, 120, 140); // V領
      } else if (type === 'tshirt') {
        ctx.fillStyle = "#17b890";
        ctx.beginPath();
        ctx.moveTo(160, 60); ctx.lineTo(440, 60);
        ctx.lineTo(560, 220); ctx.lineTo(470, 270);
        ctx.lineTo(430, 650); ctx.lineTo(170, 650);
        ctx.lineTo(130, 270); ctx.lineTo(40, 220);
        ctx.closePath();
        ctx.fill();
        ctx.clearRect(250, 50, 100, 45); // 圓領
      } else {
        ctx.fillStyle = "#e056fd";
        ctx.beginPath();
        ctx.moveTo(190, 60); ctx.lineTo(410, 60);
        ctx.lineTo(460, 240); ctx.lineTo(560, 680);
        ctx.lineTo(40, 680); ctx.lineTo(140, 240);
        ctx.closePath();
        ctx.fill();
      }

      const img = new Image();
      img.src = cvs.toDataURL();
      return img;
    }

    // ==========================================
    // 2. 圖庫載入 (支援 clothes/ 資料夾與 LocalStorage)
    // ==========================================
    async function loadOutfits() {
      outfits = [];

      // A. 從 LocalStorage 載入自訂快取衣服
      const stored = localStorage.getItem("virtual_fitting_custom_clothes");
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          parsed.forEach(item => {
            const img = new Image();
            img.src = item.data;
            outfits.push({ name: item.name, img: img, isCustom: true });
          });
        } catch (e) {
          console.error("讀取本機快取失敗", e);
        }
      }

      // B. 預設嘗試載入的本機資料夾檔案清單
      const folderFiles = [
        { name: "預設西裝", path: "clothes/01.png" },
        { name: "休閒上衣", path: "clothes/02.png" },
        { name: "特色洋裝", path: "clothes/03.png" }
      ];

      for (const item of folderFiles) {
        const loadedImg = await checkImageExists(item.path);
        if (loadedImg) {
          outfits.push({ name: item.name, img: loadedImg, isCustom: false });
        }
      }

      // C. 若無自訂與資料夾圖檔，使用示範服飾
      if (outfits.length === 0) {
        outfits.push({ name: "示範西裝", img: createDemoClothing('jacket'), isCustom: false });
        outfits.push({ name: "示範T恤", img: createDemoClothing('tshirt'), isCustom: false });
        outfits.push({ name: "示範禮服", img: createDemoClothing('dress'), isCustom: false });
      }

      renderButtons();
    }

    function checkImageExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function renderButtons() {
      btnGroup.innerHTML = '';
      outfits.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cloth-item';

        const btn = document.createElement('button');
        btn.className = `cloth-btn ${idx === currentOutfitIdx ? 'active' : ''}`;
        btn.innerText = `【${idx + 1}】 ${item.name}`;
        btn.onclick = () => selectOutfit(idx);
        row.appendChild(btn);

        if (item.isCustom) {
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerHTML = '🗑';
          delBtn.title = '刪除此衣服';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            removeCustomOutfit(item.name);
          };
          row.appendChild(delBtn);
        }

        btnGroup.appendChild(row);
      });
    }

    function selectOutfit(idx) {
      if (idx >= 0 && idx < outfits.length) {
        currentOutfitIdx = idx;
        renderButtons();
      }
    }

    // ==========================================
    // 3. 上傳 PNG 並儲存
    // ==========================================
    document.getElementById('cloth-uploader').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      let storedList = [];
      const rawStored = localStorage.getItem("virtual_fitting_custom_clothes");
      if (rawStored) {
        try { storedList = JSON.parse(rawStored); } catch(err){}
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result;
          const cleanName = file.name.replace(/\.[^/.]+$/, "");

          const img = new Image();
          img.onload = () => {
            outfits.push({ name: cleanName, img: img, isCustom: true });
            currentOutfitIdx = outfits.length - 1;
            renderButtons();

            storedList.push({ name: cleanName, data: base64Data });
            try {
              localStorage.setItem("virtual_fitting_custom_clothes", JSON.stringify(storedList));
            } catch (quotaError) {
              console.warn("本機快取已達上限");
            }
          };
          img.src = base64Data;
        };
        reader.readAsDataURL(file);
      });
    });

    function removeCustomOutfit(name) {
      outfits = outfits.filter(o => o.name !== name);
      currentOutfitIdx = Math.max(0, currentOutfitIdx - 1);
      
      const rawStored = localStorage.getItem("virtual_fitting_custom_clothes");
      if (rawStored) {
        try {
          let list = JSON.parse(rawStored);
          list = list.filter(item => item.name !== name);
          localStorage.setItem("virtual_fitting_custom_clothes", JSON.stringify(list));
        } catch(err){}
      }
      renderButtons();
    }

    // ==========================================
    // 4. 即時姿勢追蹤與貼衣繪製
    // ==========================================
    function onResults(results) {
      if (loadingMask.style.display !== 'none') {
        loadingMask.style.display = 'none';
      }

      canvasElement.width = videoElement.videoWidth || 1280;
      canvasElement.height = videoElement.videoHeight || 720;
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);
      
      // 繪製視訊底圖
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const leftShoulder = lm[11];
        const rightShoulder = lm[12];

        // 確保雙肩置信度足夠
        if (leftShoulder.visibility > 0.4 && rightShoulder.visibility > 0.4) {
          const pL = { x: leftShoulder.x * w, y: leftShoulder.y * h };
          const pR = { x: rightShoulder.x * w, y: rightShoulder.y * h };

          // 計算兩肩連線與傾斜角
          const dx = pR.x - pL.x;
          const dy = pR.y - pL.y;
          const shoulderWidth = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);

          // 衣服依體型寬度等比縮放
          const targetWidth = shoulderWidth * 2.2;
          const currentItem = outfits[currentOutfitIdx];

          if (currentItem && currentItem.img && currentItem.img.width > 0) {
            const currentImg = currentItem.img;
            const aspectRatio = currentImg.height / currentImg.width;
            const targetHeight = targetWidth * aspectRatio;

            // 兩肩中點做為中心旋轉基準點
            const centerX = (pL.x + pR.x) / 2;
            const centerY = (pL.y + pR.y) / 2;

            // 領口對齊垂直偏移量（下移貼齊肩膀與鎖骨線）
            const collarOffsetY = targetHeight * collarOffsetPercent;

            canvasCtx.save();
            canvasCtx.translate(centerX, centerY);
            canvasCtx.rotate(angle);
            canvasCtx.drawImage(
              currentImg,
              -targetWidth / 2,
              -collarOffsetY,
              targetWidth,
              targetHeight
            );
            canvasCtx.restore();
          }
        }
      }
      canvasCtx.restore();
    }

    // ==========================================
    // 5. 初始化 MediaPipe 模型與視訊
    // ==========================================
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // ==========================================
    // 6. 全螢幕投影切換與鍵盤快捷鍵
    // ==========================================
    document.getElementById('fs-btn').onclick = () => toggleFullScreen();

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        sidebar.classList.add('panel-hidden');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        sidebar.classList.remove('panel-hidden');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        currentOutfitIdx = (currentOutfitIdx + 1) % outfits.length;
        renderButtons();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        currentOutfitIdx = (currentOutfitIdx - 1 + outfits.length) % outfits.length;
        renderButtons();
      } else if (!isNaN(e.key) && parseInt(e.key) >= 1 && parseInt(e.key) <= outfits.length) {
        selectOutfit(parseInt(e.key) - 1);
      }
    });

    loadOutfits();
  </script>
</body>
</html>
